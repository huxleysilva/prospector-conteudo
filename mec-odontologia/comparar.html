<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEC Clínica Odontológica — antes e depois</title>
<meta name="description" content="Comparação lado a lado: o site atual da MEC Clínica Odontológica e a proposta de redesign.">
<style>
  :root{
    --tinta:#0B2B2A;
    --aqua:#2EB6AE;
    --aqua-profundo:#0F7C76;
    --nevoa:#E7F5F3;
    --papel:#FBFDFC;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Inter Tight",-apple-system,"Segoe UI",sans-serif;
    background:var(--papel);color:var(--tinta);
    display:flex;flex-direction:column;min-height:100vh;
  }
  :focus-visible{outline:3px solid var(--aqua-profundo);outline-offset:2px}
  header{
    padding:18px 28px;border-bottom:1px solid #D8ECE9;background:var(--papel);
    display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;
  }
  header h1{font-size:1.1rem;font-weight:600}
  header p{font-size:.88rem;color:#3E5C5A}
  .paineis{
    flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:0;
  }
  .painel{display:flex;flex-direction:column;min-height:70vh;border-right:1px solid #D8ECE9}
  .painel:last-child{border-right:0}
  .painel-topo{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 16px;font-size:.85rem;
  }
  .painel-topo .tag{
    font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:.72rem;
    padding:4px 10px;border-radius:3px;
  }
  .antigo .tag{background:#EFE6DC;color:#6B5334}
  .novo .tag{background:var(--nevoa);color:var(--aqua-profundo)}
  .painel-topo a{
    color:var(--aqua-profundo);text-decoration:none;font-weight:600;white-space:nowrap;
  }
  .painel-topo a:hover{text-decoration:underline}
  iframe{flex:1;width:100%;border:0;border-top:1px solid #D8ECE9;background:#fff}
  @media (max-width: 900px){
    .paineis{grid-template-columns:1fr}
    .painel{border-right:0;border-bottom:1px solid #D8ECE9}
    .painel:last-child{border-bottom:0}
    .painel{min-height:85vh}
  }
</style>
</head>
<body>
<header>
  <h1>MEC Clínica Odontológica — antes e depois</h1>
  <p>Mesmo conteúdo, mesma identidade e cores da marca. Só a apresentação muda.</p>
</header>

<div class="paineis">
  <section class="painel antigo" aria-label="Site atual">
    <div class="painel-topo">
      <span class="tag">Site atual</span>
      <a href="https://mecodontologia.meudoutor.com/" target="_blank" rel="noopener">abrir em nova aba ↗</a>
    </div>
    <iframe src="https://mecodontologia.meudoutor.com/" title="Site atual da MEC Clínica Odontológica" loading="lazy"></iframe>
  </section>

  <section class="painel novo" aria-label="Proposta de redesign">
    <div class="painel-topo">
      <span class="tag">Proposta nova</span>
      <a href="index.html" target="_blank" rel="noopener">abrir em nova aba ↗</a>
    </div>
    <iframe src="index.html" title="Proposta de redesign para a MEC Clínica Odontológica"></iframe>
  </section>
</div>
</body>
</html>
